<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f15325"/>
    </marker>
  </defs>
  
  <rect width="1200" height="675" fill="#f7f4ed"/>
  
  <text x="600" y="60" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="28" font-weight="700">从矩阵到综述</text>
  <text x="600" y="95" text-anchor="middle" fill="rgba(28,28,28,0.4)" font-family="system-ui, sans-serif" font-size="16">用结构化比较替代模糊叙事：先聚类、再识别冲突、最后写带页码引用的段落</text>
  
  <!-- Matrix input -->
  <g transform="translate(80, 160)">
    <rect width="340" height="360" rx="16" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="170" y="35" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">比较矩阵</text>
    
    <rect x="20" y="55" width="300" height="30" rx="4" fill="rgba(241,83,37,0.08)"/>
    <text x="30" y="75" fill="#1c1c1c" font-family="monospace" font-size="10" font-weight="600">year | ID | data | sample | finding | strength</text>
    
    <rect x="20" y="90" width="300" height="30" rx="4" fill="rgba(28,28,28,0.03)"/>
    <text x="30" y="110" fill="#5f5f5d" font-family="monospace" font-size="10">1994 | DID | 快餐店 | NJ/PA | 无显著下降 | A-</text>
    
    <rect x="20" y="125" width="300" height="30" rx="4" fill="rgba(28,28,28,0.03)"/>
    <text x="30" y="145" fill="#5f5f5d" font-family="monospace" font-size="10">2000 | DID | 州面板 | 青少年 | 显著负向 | B+</text>
    
    <rect x="20" y="160" width="300" height="30" rx="4" fill="rgba(28,28,28,0.03)"/>
    <text x="30" y="180" fill="#5f5f5d" font-family="monospace" font-size="10">2011 | BD | QCEW/CPS | 边界县 | 负向减弱 | A-</text>
    
    <text x="170" y="230" text-anchor="middle" fill="#f15325" font-family="system-ui, sans-serif" font-size="13" font-weight="600">关键观察</text>
    
    <text x="170" y="255" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">识别策略不同 → 结果方向不同</text>
    
    <text x="170" y="280" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">数据时期不同 → 外部效度差异</text>
    <text x="170" y="305" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">样本行业不同 → 结论边界不同</text>
  </g>
  
  <!-- Step 1: Cluster -->
  <g transform="translate(460, 160)">
    <rect width="200" height="90" rx="12" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="32" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">步骤 1：按方法聚类</text>
    <text x="100" y="58" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">DID 组 vs 边界断点组</text>
    <text x="100" y="80" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">比较同方法内的异同</text>
  </g>
  
  <!-- Step 2: Conflict -->
  <g transform="translate(460, 280)">
    <rect width="200" height="90" rx="12" fill="#fff" stroke="#f15325" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="32" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">步骤 2：识别冲突</text>
    <text x="100" y="58" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">结果方向是否一致？</text>
    <text x="100" y="80" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">追问数据/样本/控制变量</text>
  </g>
  
  <!-- Step 3: Boundary -->
  <g transform="translate(460, 400)">
    <rect width="200" height="90" rx="12" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="32" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">步骤 3：追问边界</text>
    <text x="100" y="58" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">结论在何种条件下成立？</text>
    <text x="100" y="80" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">能否推广到自己的设定？</text>
  </g>
  
  <!-- Output paragraph -->
  <g transform="translate(700, 160)">
    <rect width="420" height="330" rx="16" fill="rgba(241,83,37,0.08)" stroke="#f15325" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="35" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">输出：带页码引用的综述段落</text>
    
    <rect x="25" y="55" width="370" height="250" rx="10" fill="#fff" stroke="#eceae4" stroke-width="1"/>
    
    <text x="40" y="85" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">Card and Krueger (1994) 利用新泽西州</text>
    <text x="40" y="108" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">1992 年最低工资上调，通过 DID 发现快餐业</text>
    <text x="40" y="131" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">就业未显著下降 <tspan fill="#f15325" font-weight="600">[p. 784]</tspan>；而 Neumark and</text>
    <text x="40" y="154" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">Wascher (2000) 基于州级面板得出青少年就业</text>
    <text x="40" y="177" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">显著负向影响 <tspan fill="#f15325" font-weight="600">[p. xx]</tspan>。Allegretto et al. (2011)</text>
    <text x="40" y="200" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">使用边界断点设计后，负向效应明显减弱</text>
    <text x="40" y="223" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13"><tspan fill="#f15325" font-weight="600">[p. xx]</tspan>。这一分歧提示，最低工资的就业效应</text>
    <text x="40" y="246" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">高度依赖于识别策略与样本边界。</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 420 235 L 450 205" fill="none" stroke="#f15325" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <path d="M 560 250 L 560 270" fill="none" stroke="#f15325" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <path d="M 560 370 L 560 390" fill="none" stroke="#f15325" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <path d="M 660 445 L 690 445" fill="none" stroke="#f15325" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <!-- Bottom principle -->
  <rect x="150" y="540" width="900" height="100" rx="16" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
  
  <text x="600" y="575" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">综述写作的本质不是罗列文献，而是解释分歧的来源</text>
  
  <text x="600" y="610" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="14">矩阵把识别策略、数据条件、结论边界并置，让研究者看到“为什么同一问题会有不同答案”。</text>
</svg>
