<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1c1c1c"/>
    </marker>
    <marker id="arrowhead-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f15325"/>
    </marker>
  </defs>
  
  <rect width="1200" height="675" fill="#f7f4ed"/>
  
  <text x="600" y="60" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="28" font-weight="700">文献综述工作流</text>
  <text x="600" y="95" text-anchor="middle" fill="rgba(28,28,28,0.4)" font-family="system-ui, sans-serif" font-size="16">从 PDF 到结构化研究资产的完整链路</text>
  
  <g transform="translate(80, 160)">
    <rect width="180" height="120" rx="16" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="25" width="50" height="65" rx="6" fill="rgba(241,83,37,0.08)" stroke="#f15325" stroke-width="1.5"/>
    <text x="45" y="55" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="20">PDF</text>
    <text x="90" y="45" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Zotero 文献库</text>
    <text x="90" y="70" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">按主题/方法整理</text>
    <text x="90" y="92" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">的 PDF 与批注</text>
  </g>
  
  <path d="M 270 220 L 330 220" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <g transform="translate(350, 160)">
    <rect width="220" height="120" rx="16" fill="#fff" stroke="#f15325" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="38" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Claude Code Skill</text>
    <rect x="30" y="55" width="160" height="42" rx="8" fill="rgba(28,28,28,0.03)" stroke="#eceae4"/>
    <text x="40" y="80" fill="#5f5f5d" font-family="monospace" font-size="12">/literature-review ...</text>
  </g>
  
  <path d="M 580 220 L 640 220" fill="none" stroke="#f15325" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead-accent)"/>
  
  <g transform="translate(660, 140)">
    <rect width="200" height="90" rx="12" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="32" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="15" font-weight="600">单篇文献笔记</text>
    <text x="100" y="55" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">citekey + 字段</text>
    <text x="100" y="75" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">page_references</text>
  </g>
  
  <g transform="translate(660, 250)">
    <rect width="200" height="90" rx="12" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="32" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="15" font-weight="600">比较矩阵 matrix.md</text>
    <text x="100" y="55" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">按年份/证据强度排序</text>
    <text x="100" y="75" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">方法 × 数据 × 结论边界</text>
  </g>
  
  <path d="M 760 310 L 760 360 L 840 360" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <g transform="translate(850, 310)">
    <rect width="240" height="100" rx="16" fill="rgba(241,83,37,0.08)" stroke="#f15325" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="38" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">研究者人工综合</text>
    <text x="120" y="62" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">按方法聚类 → 识别冲突</text>
    <text x="120" y="84" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="13">追问边界 → 写综述段落</text>
  </g>
  
  <rect x="150" y="480" width="900" height="120" rx="16" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
  
  <text x="600" y="520" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">核心原则</text>
  
  <g transform="translate(200, 545)">
    <circle cx="10" cy="-5" r="10" fill="rgba(241,83,37,0.08)" stroke="#f15325"/>
    <text x="10" y="0" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">1</text>
    <text x="30" y="0" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="14">提取优先于综合：AI 只拆字段，不写综述</text>
  </g>
  
  <g transform="translate(630, 545)">
    <circle cx="10" cy="-5" r="10" fill="rgba(241,83,37,0.08)" stroke="#f15325"/>
    <text x="10" y="0" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">2</text>
    <text x="30" y="0" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="14">可追溯优先于流畅：每个结论带页码来源</text>
  </g>
  
  <g transform="translate(200, 575)">
    <circle cx="10" cy="-5" r="10" fill="rgba(241,83,37,0.08)" stroke="#f15325"/>
    <text x="10" y="0" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">3</text>
    <text x="30" y="0" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="14">结构优先于叙事：输出表格与 YAML，而非段落</text>
  </g>
  
  <g transform="translate(630, 575)">
    <circle cx="10" cy="-5" r="10" fill="rgba(241,83,37,0.08)" stroke="#f15325"/>
    <text x="10" y="0" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">4</text>
    <text x="30" y="0" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="14">判断仍由研究者完成：AI 降低整理成本</text>
  </g>
</svg>
