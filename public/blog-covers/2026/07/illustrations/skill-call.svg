<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f15325"/>
    </marker>
  </defs>
  
  <rect width="1200" height="675" fill="#f7f4ed"/>
  
  <text x="600" y="60" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Skill 调用与输出</text>
  <text x="600" y="95" text-anchor="middle" fill="rgba(28,28,28,0.4)" font-family="system-ui, sans-serif" font-size="16">一个命令，完成从 PDF 到结构化笔记与比较矩阵的转换</text>
  
  <!-- Terminal window -->
  <g transform="translate(250, 150)">
    <rect width="700" height="180" rx="16" fill="#1c1c1c" filter="url(#shadow)"/>
    <circle cx="30" cy="25" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="25" r="7" fill="#febc2e"/>
    <circle cx="74" cy="25" r="7" fill="#28c840"/>
    
    <text x="40" y="70" fill="#f15325" font-family="monospace" font-size="16" font-weight="600">$ /literature-review</text>
    <text x="220" y="70" fill="#f7f4ed" font-family="monospace" font-size="16">"minimum wage employment"</text>
    <text x="40" y="100" fill="#f7f4ed" font-family="monospace" font-size="16">  ./papers ./output/lit-review</text>
    
    <text x="40" y="145" fill="rgba(247,244,237,0.5)" font-family="monospace" font-size="13">> Reading 12 PDFs...</text>
    <text x="40" y="165" fill="rgba(247,244,237,0.5)" font-family="monospace" font-size="13">> Extracting schema fields...</text>
  </g>
  
  <!-- Inputs -->
  <g transform="translate(80, 180)">
    <rect width="140" height="110" rx="12" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="70" y="35" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">输入参数</text>
    <text x="70" y="62" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">topic</text>
    <text x="70" y="84" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">pdf_folder</text>
    <text x="70" y="106" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">output_folder</text>
  </g>
  
  <path d="M 230 235 L 240 235" fill="none" stroke="#f15325" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <!-- Outputs -->
  <g transform="translate(250, 360)">
    <rect width="320" height="240" rx="16" fill="#fff" stroke="#eceae4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="160" y="35" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">单篇文献笔记</text>
    
    <rect x="25" y="55" width="270" height="42" rx="8" fill="rgba(28,28,28,0.03)" stroke="#eceae4"/>
    <text x="40" y="80" fill="#5f5f5d" font-family="monospace" font-size="12">cardkrueger1994.md</text>
    
    <rect x="25" y="105" width="270" height="42" rx="8" fill="rgba(28,28,28,0.03)" stroke="#eceae4"/>
    <text x="40" y="130" fill="#5f5f5d" font-family="monospace" font-size="12">neumarkwascher2000.md</text>
    
    <rect x="25" y="155" width="270" height="42" rx="8" fill="rgba(28,28,28,0.03)" stroke="#eceae4"/>
    <text x="40" y="180" fill="#5f5f5d" font-family="monospace" font-size="12">allegrettoetal2011.md</text>
  </g>
  
  <g transform="translate(630, 360)">
    <rect width="320" height="240" rx="16" fill="#fff" stroke="#f15325" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="35" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="600">比较矩阵 matrix.md</text>
    
    <rect x="25" y="55" width="270" height="28" rx="4" fill="rgba(241,83,37,0.08)"/>
    <text x="35" y="74" fill="#1c1c1c" font-family="monospace" font-size="10" font-weight="600">citekey | year | ID | data | sample | findings</text>
    
    <rect x="25" y="88" width="270" height="28" rx="4" fill="rgba(28,28,28,0.03)"/>
    <text x="35" y="107" fill="#5f5f5d" font-family="monospace" font-size="10">cardkrueger | 1994 | DID | ... | ... | ...</text>
    
    <rect x="25" y="121" width="270" height="28" rx="4" fill="rgba(28,28,28,0.03)"/>
    <text x="35" y="140" fill="#5f5f5d" font-family="monospace" font-size="10">neumarkwascher | 2000 | DID | ... | ... | ...</text>
    
    <rect x="25" y="154" width="270" height="28" rx="4" fill="rgba(28,28,28,0.03)"/>
    <text x="35" y="173" fill="#5f5f5d" font-family="monospace" font-size="10">allegrettoetal | 2011 | BD | ... | ... | ...</text>
    
    <text x="160" y="210" text-anchor="middle" fill="#5f5f5d" font-family="system-ui, sans-serif" font-size="12">按年份与证据强度排序</text>
  </g>
  
  <!-- Arrow from terminal to outputs -->
  <path d="M 600 330 L 600 350" fill="none" stroke="#f15325" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <!-- Bottom note -->
  <rect x="200" y="620" width="800" height="40" rx="8" fill="rgba(241,83,37,0.08)" stroke="#f15325" stroke-width="1"/>
  <text x="600" y="645" text-anchor="middle" fill="#1c1c1c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">约束：Skill 只输出结构化数据，不写综述段落；判断仍由研究者完成</text>
</svg>
